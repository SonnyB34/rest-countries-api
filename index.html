<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script
      type="module"
      src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"></script>
    <script
      nomodule
      src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"></script>
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
    <title>Rest Countries API</title>
  </head>
  <body>
    <header>
      <div class="container">
        <nav>
          <div class="logo">
            <h1>Where In The World?</h1>
          </div>

          <button id="dark-btn" class="dark-btn">
            <ion-icon name="moon-outline"></ion-icon>Dark Mode
          </button>
        </nav>
      </div>
    </header>

    <main>
      <div class="container">
        <div class="user-inputs">
          <div class="search">
            <ion-icon name="search-outline"></ion-icon>
            <input
              type="text"
              id="search-input"
              placeholder="Seach A Country..." />
          </div>

          <div class="selection">
            <select name="filter-input" id="filter-input">
              <option value="">Filter by Region</option>
              <option value="africa">Africa</option>
              <option value="america">America</option>
              <option value="asia">Asia</option>
              <option value="europe">Europe</option>
              <option value="oceania">Oceania</option>
            </select>
          </div>
        </div>

        <div id="countries-container" class="countries-container"></div>

        <div id="country-info" class="country-info"></div>
      </div>
    </main>
  </body>
</html>
